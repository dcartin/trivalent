[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trivalent"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "numba>=0.60",
    "numpy>=2.0"
]

[tool.setuptools]
packages = ["trivalent"]

[tool.setuptools.dynamic]
version = {attr = "trivalent.__version__"}  # <--- Points setuptools to __init__.py